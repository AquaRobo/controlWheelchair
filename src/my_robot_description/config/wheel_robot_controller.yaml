controller_manager:
  ros__parameters:
    update_rate: 100
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    simple_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

simple_velocity_controller:
  ros__parameters:
    joints:
      - lb_joint
      - rb_joint

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["lb_joint"]
    right_wheel_names: ["rb_joint"]
    wheel_separation: 0.55
    wheel_radius: 0.0825
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
    use_stamped_vel: true
    publish_rate: 50.0

arm_controller:
  ros__parameters:
    joints:
      - base_arm_joint
      - shoulder_joint
      - geared_joint
      - arm_joint
      - wrist_joint
      - gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: true
    allow_integration_in_goal_trajectories: true
    constraints:
      goal_time: 2.0
    use_sim_time: false

gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 1.0
    use_sim_time: false
