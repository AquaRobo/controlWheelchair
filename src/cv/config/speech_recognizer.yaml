# ── Audio ─────────────────────────────────────────────────────
sample_rate: 16000            # sounddevice capture rate (Whisper native)
target_sample_rate: 16000     # Whisper expects 16 kHz

# ── Microphone ───────────────────────────────────────────────
mic_device: 0             # set to a number, "default", or "pulse" to override auto-detection
mic_channels: 1              # 1 or 2
mic_rate: 16000              # preferred sample rate for the microphone

# ── Wake word detection ───────────────────────────────────────
wake_duration: 2.0            # seconds per rolling listen chunk
wake_words:
  milo: Milo
  jarvis: Jarvis

# ── Silence / energy gate ─────────────────────────────────────
energy_threshold: 0.01        # chunks below this RMS are skipped

# ── Cooldown ──────────────────────────────────────────────────
cooldown_seconds: 2.0         # minimum seconds between wake-word detections

# ── Command recording ─────────────────────────────────────────
command_duration: 3.0         # seconds of audio captured for Whisper after wake word

# ── Whisper ───────────────────────────────────────────────────
whisper_model: tiny.en        # tiny.en is fast; use base.en for better accuracy

# ── Command extraction ────────────────────────────────────────
rooms:
  - kitchen
  - bedroom
  - bathroom
  - living room
  - dining room
  - office

objects:
  - phone
  - laptop
  - tv
  - bottle
  - cup
  - book
  - remote
  - water

actions:
  - grab
  - up
  - down
  - left
  - right
  - back
  - forward
  - close
  - open
  - lean
  - cup
  - bottle
  - level
  - raise
  - lower
  - water
  - "first position"
  - "second position"
  - "exit command mode"