# Audio
sample_rate: 16000
listen_duration: 3
buffer_size: 16000

# Wake word
wake_word_threshold: 0.4

# Whisper
whisper_model: tiny.en

# Command extraction
rooms:
  - kitchen
  - bedroom
  - bathroom
  - living room
  - dining room
  - office

objects:
  - phone
  - laptop
  - tv
  - bottle
  - cup
  - book
  - remote
