moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    action_ns: follow_joint_trajectory
    default: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01
    allow_nonzero_velocity_at_trajectory_end: true

  gripper_controller:
    type: FollowJointTrajectory  # Same as arm controller
    joints:
      - Gripper_Idol_Gear_Joint
      - Gripper_Servo_Gear_Joint
    action_ns: follow_joint_trajectory  # Same action namespace
    default: false
    parallel: true
    constraints:
      goal_time: 1.0  # Faster for gripper
      stopped_velocity_tolerance: 0.01
    allow_nonzero_velocity_at_trajectory_end: true